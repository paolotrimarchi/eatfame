<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E7">
<title>Sera · Your order</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <div class="co-hdr">
    <button class="back" onclick="goBack()" aria-label="Back to the menu">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <h1 id="coTitle">Your order</h1>
    <button class="pc-pill" onclick="goBack()" aria-label="Delivery postcode">
      <svg class="pin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <span id="pcLabel">1073 AB</span>
    </button>
  </div>

  <div class="scroll"><div id="body"></div></div>

  <div class="bar" id="bar">
    <div class="in">
      <div class="sum">
        <div class="s1" id="barTotal">&nbsp;</div>
        <div class="s2" id="barNote">&nbsp;</div>
      </div>
      <button class="cta" id="barCta" onclick="placeOrder()">Place order</button>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
var cart = loadCart();
var slotIdx = -1;
var placed = false;

function paint(){
  document.getElementById('pcLabel').textContent = getPostcode();
  if (placed){ paintDone(); return; }

  if (cartCount(cart) === 0){
    document.getElementById('coTitle').textContent = 'Your order';
    document.getElementById('body').innerHTML =
        '<div class="empty">'
      +   '<h2>Nothing picked yet</h2>'
      +   '<p>Tonight it&rsquo;s Italian and Korean. Five dishes.</p>'
      +   '<button class="cta wide" onclick="goBack()">See tonight&rsquo;s menu</button>'
      + '</div>';
    document.getElementById('bar').classList.remove('up');
    return;
  }

  var day = dayByKey(cart.dayKey);
  document.getElementById('coTitle').innerHTML =
    (day.key === 'tonight' ? 'Tonight' : 'Tomorrow') + '&rsquo;s order';

  var h = '<div class="sect"><p class="sect-h">Your dishes</p></div>';

  Object.keys(cart.items).forEach(function(id){
    var d = findDish(cart.dayKey, id);
    if (!d) return;
    var q = cart.items[id];
    h += '<div class="line">'
      +    thumbHTML(d)
      +    '<div class="tx"><h4>' + d.name + '</h4><p>' + d.kitchen + '</p></div>'
      +    '<div class="rt">'
      +      '<span class="pr">' + eur(d.price * q) + '</span>'
      +      stepperHTML(id, q)
      +    '</div>'
      +  '</div>';
  });

  /* delivery hour */
  h += '<div class="sect" style="padding-top:26px">'
    +    '<p class="sect-h">Step two</p>'
    +    '<h2>Pick your hour</h2>'
    +    '<p class="lead">Quieter windows cost less, because one courier covers more doors in the same run.</p>'
    +  '</div><div class="sh-body" style="padding-top:12px">';

  h += '<div class="slots">';
  S.slots.forEach(function(s, i){
    var note = !s.open  ? 'Full'
             : s.delta < 0 ? '−' + eur(Math.abs(s.delta))
             : s.note === 'Busiest' ? 'Busiest'
             : '&nbsp;';
    h += '<button type="button" class="slot' + (i === slotIdx ? ' on' : '') + '" '
      +  (s.open ? '' : 'disabled ') + 'onclick="pickSlot(' + i + ')">'
      +    '<span class="tm">' + s.label.replace(/ – /, '–') + '</span>'
      +    '<span class="lb' + (s.open && s.delta < 0 ? ' save' : '') + '">' + note + '</span>'
      +  '</button>';
  });
  h += '</div>';

  h += '<div class="hint">'
    +    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3C4A2B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
    +    '<p>Pick an hour now. On the day we&rsquo;ll narrow it to <b>twenty minutes</b>, so you&rsquo;re not waiting by the door.</p>'
    +  '</div></div>';

  /* totals */
  var sub = cartSubtotal(cart), n = cartCount(cart);
  var disc = (slotIdx >= 0 ? S.slots[slotIdx].delta : 0) * n;

  h += '<div class="sect" style="padding-top:22px"><p class="sect-h">Total</p></div><div class="totals">'
    +  '<div class="t-row"><span>' + n + (n===1?' dish':' dishes') + '</span><span>' + eur(sub) + '</span></div>';
  if (disc < 0){
    h += '<div class="t-row disc"><span>' + S.slots[slotIdx].label + ' · quiet hour</span><span>−' + eur(Math.abs(disc)) + '</span></div>';
  }
  h += '<div class="t-row free"><span>Delivery</span><span>No delivery fee</span></div>'
    +  '<div class="t-row grand"><span>To pay</span><span>' + eur(sub + disc) + '</span></div>'
    +  '</div>';

  document.getElementById('body').innerHTML = h;
  paintBar();
}

function paintBar(){
  var bar = document.getElementById('bar');
  if (cartCount(cart) === 0){ bar.classList.remove('up'); return; }
  var n = cartCount(cart);
  var total = cartSubtotal(cart) + (slotIdx >= 0 ? S.slots[slotIdx].delta * n : 0);
  document.getElementById('barTotal').textContent = eur(total);
  document.getElementById('barNote').textContent = slotIdx >= 0
    ? ('Arriving ' + S.slots[slotIdx].label) : 'Pick an hour to continue';
  document.getElementById('barCta').disabled = (slotIdx < 0);
  bar.classList.add('up');
}

function paintDone(){
  var n = cartCount(cart);
  var total = cartSubtotal(cart) + (slotIdx >= 0 ? S.slots[slotIdx].delta * n : 0);
  var names = Object.keys(cart.items).map(function(id){
    var d = findDish(cart.dayKey, id);
    return d ? (cart.items[id] > 1 ? cart.items[id] + '× ' : '') + d.name : '';
  }).filter(Boolean).join(', ');

  document.getElementById('coTitle').innerHTML = 'Confirmed';
  document.getElementById('body').innerHTML =
      '<div class="done">'
    +   '<div class="tick"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#F7F2E7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'
    +   '<h2>Dinner&rsquo;s done for the day</h2>'
    +   '<p>The kitchens get the count at three and start cooking. We&rsquo;ll message you on the day once your hour is narrowed to twenty minutes.</p>'
    +   '<div class="rec">'
    +     '<div class="r"><span>Dishes</span><span>' + names + '</span></div>'
    +     '<div class="r"><span>Arriving</span><span>' + (slotIdx >= 0 ? S.slots[slotIdx].label : '—') + '</span></div>'
    +     '<div class="r"><span>To</span><span>' + getPostcode() + '</span></div>'
    +     '<div class="r"><span>Delivery</span><span>No fee</span></div>'
    +     '<div class="r"><span>Total</span><span>' + eur(total) + '</span></div>'
    +   '</div>'
    + '</div>'
    + '<div class="sh-body" style="padding-top:20px">'
    +   '<button class="cta ghost wide" onclick="startOver()">Back to the menu</button>'
    + '</div>'
    + '<div class="foot" style="margin-top:14px"><p>Sera isn&rsquo;t delivering yet, so nothing has been '
    + 'charged and no food is coming. This is a prototype of the ordering flow.</p></div>';
  document.getElementById('bar').classList.remove('up');
}

function bump(id, delta){
  var n = (cart.items[id] || 0) + delta;
  if (n <= 0) delete cart.items[id]; else cart.items[id] = n;
  saveCart(cart); syncUrl(); paint();
}
function pickSlot(i){ if (!S.slots[i].open) return; slotIdx = i; paint(); }
function placeOrder(){ if (slotIdx < 0) return; placed = true; paint(); document.querySelector('.scroll').scrollTop = 0; }
function startOver(){ cart = emptyCart(); saveCart(cart); location.href = 'index.html?pc=' + encodeURIComponent(getPostcode()); }
function goBack(){ location.href = 'index.html?' + cartQuery(cart); }
function syncUrl(){ if (history.replaceState) history.replaceState(null, '', 'checkout.html?' + cartQuery(cart)); }

paint();
</script>
</body>
</html>
